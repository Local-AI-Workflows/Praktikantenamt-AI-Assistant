version: '3'

services:
    minio:
        container_name: minio
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        command: 'server /data --console-address ":9001"'

        ports:
            - "9000:9000"
            - "9001:9001"
              
        volumes:
            - "./minio-data:/data:rw"
